# Fly.io deployment — see docs/DEPLOYMENT.md
#   fly launch --no-deploy --copy-config   (pick a unique app name)
#   fly deploy
app = "netpulse-demo"            # change to your own unique name
primary_region = "sin"            # pick a region near you: fly platform regions

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9469"

[http_service]
  internal_port = 9469
  force_https = true
  # NetPulse is a monitor: it must keep running to keep checking, so never
  # scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
